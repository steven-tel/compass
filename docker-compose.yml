services:
  backend:
    build:
      context: ./backend
    image: compass-backend:local
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MODEL: ${MODEL:-gemini-3.1-flash-live-preview}
      EXERCISE_DETECTOR_MODEL: ${EXERCISE_DETECTOR_MODEL:-gemini-3.5-flash-lite}
      FIRESTORE_PROJECT: ${FIRESTORE_PROJECT:-}
      FIRESTORE_DATABASE: ${FIRESTORE_DATABASE:-compas-database}

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    image: compass-frontend:local
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    depends_on:
      - backend
