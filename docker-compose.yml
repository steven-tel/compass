services:
  backend:
    build:
      context: ./backend
    image: compass-backend:local
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    image: compass-frontend:local
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    depends_on:
      - backend
